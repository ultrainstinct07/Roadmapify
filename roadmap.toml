# roadmap.toml — the plan.
#
# Hand-edit this file. Everything under roadmap-out/ except journal.jsonl and
# evidence.jsonl is derived from it and is regenerated by `roadmap build`.
#
# There is deliberately NO status field. Status is derived from git evidence on
# every run, so it cannot go stale. Recording that evidence is P-3:
# `roadmap start` / `roadmap done` and the `Roadmap: T-nn` commit trailer all
# arrive with it. Until then nothing reads as done, which is the honest answer.

schema = 1

[goal]
label = "roadmapify: a phased build plan with memory that survives context loss"
statement = "A roadmap CLI plus skill that holds the north-star goal, a phase/task dependency DAG and a decision memory as a real graph; derives progress from git rather than believing self-report; and reports branch hygiene without ever writing a git ref."
# why this project exists at all — the first thing lost when context is compacted
why = "Every compaction, /clear and new machine loses the goal, the phase plan, and the approaches already rejected. That context lives in chat scrollback, which is not a durable medium, so decisions get re-litigated and branches pile up that nobody can place."
archetype = "cli"
created = "2026-09-08T08:42:21Z"
# checkable sentences. The last phase is not done until these are true.
success_criteria = [
    "an agent with zero context recovers full working understanding from one command",
    "roadmap check blocks a re-proposal of a recorded rejection, with the reason",
    "task status is never stored, only derived from git evidence",
    "roadmap moderate reports branch hygiene and never writes a git ref",
    "base install has one conditional dependency and needs no API key",
]

[[phase]]
id = "P-1"
label = "It remembers"
order = 1
intent = "Durable goal + decision memory, before any graph, git or phase logic"
# a literal command or observable outcome — if you cannot write this,
# the phase is not a phase yet
ships = "`roadmap note` / `check` / `why` / `brief` / `resume` all work offline"
exit_criteria = "a rejection recorded on day one blocks its re-proposal on day thirty"
demo = "record a decision, then try to re-propose it"

[[phase]]
id = "P-2"
label = "It plans"
order = 2
intent = "A one-line goal becomes the complete phased path with a dependency DAG"
# a literal command or observable outcome — if you cannot write this,
# the phase is not a phase yet
ships = "`roadmap next` prints the active phase, ready tasks and the critical path"
exit_criteria = "a dependency cycle fails the build naming every hop"
demo = "roadmap tree on a fresh init"

[[phase]]
id = "P-3"
label = "It watches git"
order = 3
intent = "Derive status from real commits; start scoring our own divergence"
# a literal command or observable outcome — if you cannot write this,
# the phase is not a phase yet
ships = "`roadmap next` prints agreement and coverage on line 2"
exit_criteria = "task status flips from evidence alone, never from a stored field"
demo = "commit on a branch, watch the status move"

[[phase]]
id = "P-4"
label = "It maintains itself"
order = 4
intent = "Upkeep costs zero; evidence survives the ordinary PR flow"
# a literal command or observable outcome — if you cannot write this,
# the phase is not a phase yet
ships = "one `roadmap hook install` keeps BRIEF.md current with no human effort"
exit_criteria = "a squash-merge of a multi-commit branch upgrades done* to done"
demo = "squash-merge a PR and run roadmap next"
provisional = true

[[phase]]
id = "P-5"
label = "It verifies"
order = 5
intent = "Claimed-done versus actually-present, with the optional code-graph bridge"
# a literal command or observable outcome — if you cannot write this,
# the phase is not a phase yet
ships = "`roadmap verify` reports present / missing / unverifiable / unresolvable per deliverable"
exit_criteria = "a task claiming done with an absent deliverable is contradicted"
demo = "mark something done that does not exist"

[[phase]]
id = "P-6"
label = "It moderates"
order = 6
intent = "Branch hygiene, report-only"
# a literal command or observable outcome — if you cannot write this,
# the phase is not a phase yet
ships = "`roadmap moderate` prints findings with the exact git command for each"
exit_criteria = "no mutating git verb exists anywhere in the package"
demo = "roadmap moderate on a repo with a stale branch"
provisional = true

[[phase]]
id = "P-7"
label = "The agent drives it"
order = 7
intent = "Claude picks up the whole workflow without being told"
# a literal command or observable outcome — if you cannot write this,
# the phase is not a phase yet
ships = "a fresh session reads BRIEF.md before planning anything"
exit_criteria = "roadmap install wires the skill and the CLAUDE.md block"
demo = "start a new session and watch it orient itself"
provisional = true

[[phase]]
id = "P-8"
label = "MCP"
order = 8
intent = "Complete the shape for hosts that are not Claude Code"
# a literal command or observable outcome — if you cannot write this,
# the phase is not a phase yet
ships = "`roadmap-mcp` serves the read tools over stdio"
exit_criteria = "six read tools and exactly one write; none can set a status"
demo = "point a second host at it"
provisional = true

[[phase]]
id = "P-9"
label = "Optional LLM refinement"
order = 9
intent = "Complete the hybrid decomposition constraint"
# a literal command or observable outcome — if you cannot write this,
# the phase is not a phase yet
ships = "`roadmap expand P-3 --llm` refines tasks inside the fixed phase skeleton"
exit_criteria = "with no provider configured it prints one line and exits 0"
demo = "run it with and without a key"
provisional = true

